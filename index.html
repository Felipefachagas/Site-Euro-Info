<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="images/soccerBall.png" />
  <link rel="stylesheet" href="style/geral.css" />
  <link rel="stylesheet" href="style/temas.css" />
  <title>Euro Info</title>
</head>

<body>
  <!-- NavBar que estará sempre no site-->
  <nav>
    <div class="navesquerda"><img src="" alt="" /></div>
    <div class="navcentro">
      <button class="nav-btn" data-tela="champions">Champions League</button>
      <button class="nav-btn" data-tela="europa">Europa League</button>
      <button class="nav-btn" data-tela="conference">
        Conference League
      </button>
    </div>
    <div class="navdireita">
      <button class="nav-btn" data-tela="champions">
        <img src="images/championsLeague/UEFA_Champions_League_logo.png" alt="Logo da Champions League" />
      </button>
      <button class="nav-btn" data-tela="europa">
        <img src="images/europaLeague/UEFA_Europa_League_logo_(2024_version).svg.webp" alt="Logo da Europa League" />
      </button>
      <button class="nav-btn" data-tela="conference">
        <img src="images/conferenceLeague/UEFA_Conference_League_full_logo_(2024_version).svg.webp"
          alt="Logo da Conference League" />
      </button>
    </div>
  </nav>

  <!-- Conteudo da página que será inserido via DOM-->
  <main id="app">
    <section id="secao-topo" class="area-conteudo">
      <div class="container" id="destaque">
        <!--A tabela e jogos dados da API serão inseridos aqui-->
      </div>
    </section>

    <!--Aba de notícias-->
    <section id="secao-noticias" style="display:none; background-color: #edecec; color: #000; padding: 40px 20px">
      <div class="container">
        <h2>Últimas Notícias</h2>
        <div class="ordenar">
          <button class="voltar" id="voltar1" style="display: none;  border: 1px solid rgb(32, 32, 32);">
            &lt; </button>
          <div id="noticias" style="display: flex; gap: 20px; margin-top: 20px">
            <!-- O JS vai colocar os cards de notícias aqui -->
          </div>
          <button class="verMais" id="ver-mais1" style=" border: 1px solid rgb(32, 32, 32);"> > </button>

        </div>
      </div>
    </section>

    <!-- Highlights -->
    <section class="melhoresJogadores" id="secao-base" style="display:none;">
      <div class="container">
        <h2 class="safado" style="margin-bottom: 10px;">Artilheiros da história da competição</h2>
        <div class="ordenar">
          <button class="voltar" id="voltar2" style="display: none;">
            &lt; </button>
          <div id="resumos" style="display: flex; gap: 20px; margin-top: 20px "></div>
          <button class="verMais" id="ver-mais2"> > </button>
        </div>

        <!-- O JS vai colocar os jogadores aqui -->
      </div>
      </div>
    </section>
  </main>

  <!--FOOTER PADRÃO SÓ COM HTML E CSS PURO-->
  <footer></footer>
  <script src="scripts/dados.js"></script>
  <script src="scripts/dom.js"></script>
</body>

</html>
